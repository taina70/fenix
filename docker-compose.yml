
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fenix_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fenix_backend
    restart: unless-stopped
    command: >
      sh -c "if [ ! -f vendor/autoload.php ]; then
        composer install --no-interaction --prefer-dist;
      fi &&
      php artisan migrate --seed --force &&
      php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: fenix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fenix
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d fenix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: fenix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
